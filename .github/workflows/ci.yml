name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify public application
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out Series AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Check out Account AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: miguelavalos/account-av
          path: account-av

      - name: Check out Apps AV
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: miguelavalos/apps-av
          path: apps-av

      - name: Link local packages
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/account-av" "$GITHUB_WORKSPACE/../account-av"
          ln -s "$GITHUB_WORKSPACE/apps-av" "$GITHUB_WORKSPACE/../apps-av"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "22"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Validate public configuration
        run: vp run config:hygiene

      - name: Run canonical checks
        run: |
          vp run copy:audit
          vp run ios:build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          vp run web:typecheck

      - name: Verify generated files are current
        run: git diff --exit-code
